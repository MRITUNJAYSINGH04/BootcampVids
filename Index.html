<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity & Ethical Hacking Masterclass</title>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: #0d0d14;
            --border-color: #1a1a2e;
            --accent-green: #39FF14;
            --accent-glow: rgba(57, 255, 20, 0.15);
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
            --hover-bg: #141422;
            --active-bg: #1a1a2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Navigation Header */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .brand span {
            color: var(--accent-green);
        }

        .course-meta {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Main Workspace Layout */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 400px;
            flex: 1;
            height: calc(100vh - 65px);
        }

        @media (max-width: 1024px) {
            .workspace {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        /* Video Player Section */
        .player-container {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            background: radial-gradient(circle at top left, #0d0d16 0%, #050508 100%);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .current-lesson-info {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
        }

        .current-lesson-info h2 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .current-lesson-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Sidebar Playlist Section */
        .playlist-sidebar {
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .playlist-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--panel-bg);
        }

        .playlist-header h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .modules-container {
            overflow-y: auto;
            flex: 1;
        }

        /* Accordion Modules */
        .module-group {
            border-bottom: 1px solid var(--border-color);
        }

        .module-title {
            padding: 15px 20px;
            background-color: #090910;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .module-title:hover {
            background-color: var(--hover-bg);
        }

        .module-title span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .lesson-list {
            display: none;
            list-style: none;
            background-color: var(--panel-bg);
        }

        .module-group.active .lesson-list {
            display: block;
        }

        .lesson-item {
            padding: 12px 20px 12px 35px;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .lesson-item:hover {
            background-color: var(--hover-bg);
            color: var(--text-main);
        }

        .lesson-item.active {
            background-color: var(--active-bg);
            color: var(--accent-green);
            border-left: 3px solid var(--accent-green);
        }

        .lesson-item svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #33334d;
        }
    </style>
</head>

        function initPlatform() {
            const container = document.getElementById('modules-root');
            container.innerHTML = '';

            let globalLessonCounter = 0;

            courseData.forEach((mod, modIndex) => {
                const moduleGroup = document.createElement('div');
                moduleGroup.className = `module-group ${modIndex === 0 ? 'active' : ''}`;

                // Module Header
                const modHeader = document.createElement('div');
                modHeader.className = 'module-title';
                modHeader.innerHTML = `<span>${mod.module}</span> <span>${mod.lessons.length} lessons</span>`;
                
                // Toggle Module Accordion
                modHeader.addEventListener('click', () => {
                    moduleGroup.classList.toggle('active');
                });

                // Lesson List
                const lessonList = document.createElement('ul');
                lessonList.className = 'lesson-list';

                mod.lessons.forEach((lesson, lessonIndex) => {
                    const currentId = globalLessonCounter++;
                    const lessonItem = document.createElement('li');
                    lessonItem.className = `lesson-item ${currentId === 0 ? 'active' : ''}`;
                    lessonItem.innerHTML = `
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <span>${lesson.title}</span>
                    `;

                    lessonItem.addEventListener('click', () => {
                        // Remove active states from all lessons
                        document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
                        lessonItem.classList.add('active');

                        // Update Video Source & UI info securely via internal mapping
                        loadVideo(lesson.src, lesson.title, mod.module);
                    });

                    lessonList.appendChild(lessonItem);
                });

                moduleGroup.appendChild(modHeader);
                moduleGroup.appendChild(lessonList);
                container.appendChild(moduleGroup);
            });

            // Load default initial video (First lesson)
            if (courseData.length > 0 && courseData[0].lessons.length > 0) {
                loadVideo(courseData[0].lessons[0].src, courseData[0].lessons[0].title, courseData[0].module);
            }
        }

        function loadVideo(embedUrl, title, moduleName) {
            const player = document.getElementById('main-video-player');
            const titleEl = document.getElementById('current-title');
            const trackerEl = document.getElementById('current-module-tracker');

            // Set secure embedded source
            player.src = `${embedUrl}?autoplay=1&rel=0`;
            titleEl.textContent = title;
            trackerEl.textContent = moduleName;
        }

        // Initialize on load
        window.onload = initPlatform;
    </script>
